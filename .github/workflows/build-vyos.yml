name: Build VyOS Rolling Release

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 拉取官方源码 (rolling 分支)
      - name: Checkout VyOS Build Repository
        uses: actions/checkout@v4
        with:
          repository: vyos/vyos-build
          ref: rolling
          
      # 2. 构建编译环境容器
      - name: Build VyOS Docker Builder
        run: docker build -t vyos-builder docker
        
      # 3. 核心编译过程 (使用最新的 generic 风味和底层脚本)
      - name: Compile VyOS ISO
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/vyos -w /vyos vyos-builder \
          bash -c "sudo ./build-vyos-image generic --architecture amd64 --build-by 'GitHub-Actions'"
          
      # 4. 提取生成的 ISO 文件供我们下载
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyOS-Rolling-amd64
          path: build/*.iso
          retention-days: 3
